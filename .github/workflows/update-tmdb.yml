name: Refresh TMDb movie metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-tmdb.yml
      - scripts/update_tmdb_metadata.py
      - scripts/recheck_cast.py
  schedule:
    - cron: '13 19 * * 0'

permissions:
  contents: write

concurrency:
  group: refresh-tmdb-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Fetch film credits, genres and posters
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: python3 scripts/recheck_cast.py
      - uses: actions/upload-artifact@v4
        with:
          name: cast-fetch-report
          path: cast-fetch-report.json
      - name: Commit fetched metadata, merging concurrent app updates safely
        shell: bash
        run: |
          set -euo pipefail
          cp tmdb-metadata.json "$RUNNER_TEMP/tmdb-generated.json"
          cp cast-fetch-report.json "$RUNNER_TEMP/cast-fetch-report.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json, os, pathlib
          target=pathlib.Path('tmdb-metadata.json')
          generated=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'tmdb-generated.json').read_text())
          current=json.loads(target.read_text()) if target.exists() else {}
          merged=dict(current.get('films') or {})
          for id,rec in (generated.get('films') or {}).items():
              original=merged.get(id) or {}
              next_rec={**original,**rec}
              for field in ('directors','creators','posterPath','posterUrl','cast','genres'):
                  if not next_rec.get(field) and original.get(field):
                      next_rec[field]=original[field]
              # Concurrent app and workflow writes must never erase Japanese name aliases.
              jp_aliases=list(dict.fromkeys((original.get('directorAliases') or [])+(rec.get('directorAliases') or [])))
              if jp_aliases:
                  next_rec['directorAliases']=jp_aliases
              # Manually verified credits take precedence over automatic TMDb recrawls.
              verified=original.get('source','') not in ('','tmdb','tmdb-synced','corrected-credits-recheck-required')
              if verified:
                  for field in ('directors','creators','source','sourceUrl','creditRole'):
                      if field in original:
                          next_rec[field]=original[field]
              # A concurrent job can have been launched before the manual TMDB correction.
          # Never re-introduce another movie's ID, cast, or poster for the Ghibli short.
          if id == 'lb-459-1Vgm' and int(next_rec.get('tmdbId') or 0) != 10840:
              next_rec['tmdbId']=10840
              next_rec['posterPath']=''
              next_rec.pop('cast',None)
              next_rec.pop('castCheckedAt',None)
              next_rec.pop('castResolverVersion',None)
              next_rec['source']='corrected-credits-recheck-required'
          # Keep the verified Hikaru Utada concert mapping even if an older
          # scheduled run generated data before the 57044 correction.
          if id == 'custom-1791664055006-96rv' and int(next_rec.get('tmdbId') or 0) != 57044:
              next_rec['tmdbId']=57044
              next_rec['type']='movie'
              next_rec.pop('cast',None)
              next_rec.pop('castCheckedAt',None)
              next_rec.pop('castResolverVersion',None)
          merged[id]=next_rec
          generated['films']=merged
          generated['matchedCount']=len(merged)
          target.write_text(json.dumps(generated,ensure_ascii=False,indent=2)+'\n')
          PY
            cp "$RUNNER_TEMP/cast-fetch-report.json" cast-fetch-report.json
            git add -- tmdb-metadata.json cast-fetch-report.json
            if git diff --cached --quiet; then
              echo "Metadata unchanged"
              exit 0
            fi
            git commit -m "Auto-refresh TMDb credits and poster metadata"
            if git push origin HEAD:main; then
              echo "Published TMDb data"
              exit 0
            fi
            echo "Concurrent commit detected; retry $attempt"
            sleep 3
          done
          echo "Could not push after retry" >&2
          exit 1
