name: Film classification and company search tests
on:
  push:
    paths:
      - 'app-core.js'
      - 'scripts/regression/unrated-search.cjs'
      - 'scripts/regression/rerank-sync.cjs'
      - 'app-classification-metadata.js'
      - 'app-studio-metadata.js'
      - 'app-detail-layout.js'
      - 'patch-v120.js'
      - 'scripts/regression/classification.cjs'
      - '.github/workflows/movie-classification.yml'
  pull_request:
    paths:
      - 'app-core.js'
      - 'scripts/regression/unrated-search.cjs'
      - 'scripts/regression/rerank-sync.cjs'
      - 'app-classification-metadata.js'
      - 'app-studio-metadata.js'
      - 'app-detail-layout.js'
      - 'patch-v120.js'
      - 'scripts/regression/classification.cjs'
      - '.github/workflows/movie-classification.yml'
permissions:
  contents: read
jobs:
  classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Use the runner's installed Chrome
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Add Japanese font for visual checks
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --retry 2 --max-time 60 -L https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKjp-Regular.otf"
          fc-cache -f
      - run: node --check app-classification-metadata.js && node --check app-studio-metadata.js && node --check patch-v120.js
      - run: node scripts/regression/rerank-sync.cjs
      - run: node scripts/regression/classification.cjs
      - run: node scripts/regression/unrated-search.cjs
      - run: node scripts/regression/unrated-panels.cjs
      - run: node scripts/regression/rerank-navigation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classification-ui-preview
          path: test-results/*.png
          retention-days: 3
