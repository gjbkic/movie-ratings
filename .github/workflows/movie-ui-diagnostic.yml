name: Movie UI smoke diagnostic
on:
  push:
    paths:
      - .github/workflows/movie-ui-diagnostic.yml
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Exercise movie app in Chromium
        shell: bash
        run: |
          set -e
          npm install --no-save --no-package-lock playwright-core@1.56.1 >/dev/null 2>&1
          which google-chrome || which chromium || true
          python3 -m http.server 8765 >/tmp/movie-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright-core');
          (async()=>{
            const exe=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(x=>require('fs').existsSync(x));
            console.log('CHROME_PATH',exe);
            const b=await chromium.launch({executablePath:exe,headless:true,args:['--no-sandbox']});
            const page=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',msg=>{if(msg.type()==='error')errors.push('CONSOLE '+msg.text())});
            let t=Date.now();page.on('requestfailed',r=>{if(!r.url().includes('image.tmdb.org')) errors.push('REQFAIL '+r.url()+r.failure()?.errorText)});
            await page.goto('http://localhost:8765/index.html',{waitUntil:'domcontentloaded',timeout:25000});
            console.log('DOM_READY_MS',Date.now()-t);
            await page.waitForTimeout(6000);
            let state=await Promise.race([page.evaluate(()=>({ready:document.documentElement.classList.contains('movie30-ready'),count:document.querySelector('#summary')?.textContent,rank:document.querySelectorAll('#rankRoot .rank-card').length,active:document.querySelector('.tab.active')?.dataset.page,overlay:[...document.querySelectorAll('body *')].filter(x=>{const st=getComputedStyle(x);return st.position==='fixed'&&st.display!=='none'&&st.pointerEvents!=='none'&&x.getBoundingClientRect().height>window.innerHeight*.8}).slice(0,10).map(x=>x.id||x.className)})),new Promise(resolve=>setTimeout(()=>resolve('EVAL_STALLED'),3500))]);
            console.log('INIT',JSON.stringify(state),'ELAPSED',Date.now()-t,'ERRORS',JSON.stringify(errors.slice(0,20)));
            for(const selector of ['.tab[data-page="distribution"]','.tab[data-page="data"]','.tab[data-page="rank"]','#quickAdd','#closeSheet']){
               try{const start=Date.now();await page.locator(selector).first().click({timeout:3500});console.log('CLICK',selector,'DURATION',Date.now()-start,'PAGE',await page.locator('.tab.active').first().getAttribute('data-page'))}catch(e){console.log('CLICK_FAIL',selector,String(e).slice(0,900))}
            }
            console.log('FINAL_ERRORS',JSON.stringify(errors.slice(0,20)));
            await b.close();
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
