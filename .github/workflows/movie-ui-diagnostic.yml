name: Movie UI smoke diagnostic
on:
  push:
    paths:
      - .github/workflows/movie-ui-diagnostic.yml
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Isolate frozen frontend module with Chrome
        shell: bash
        run: |
          set -e
          npm install --no-save --no-package-lock playwright-core@1.56.1 >/dev/null 2>&1
          python3 -m http.server 8765 >/tmp/movie-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright-core'),fs=require('fs');
          const enh=fs.readFileSync('app-enhancements.js','utf8');
          const bds=[['clean-fix',enh],['saved-user-data-fix',enh]];
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            for(const [name,source] of bds){
              const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              const page=await context.newPage();
              if(name==='saved-user-data-fix'){
                const doc=JSON.parse(fs.readFileSync('live-state.json','utf8'));
                const persisted=Object.assign({version:23,updatedAt:Date.now()},doc.state);
                await page.addInitScript(data=>localStorage.setItem('movie30_data_v1',data),JSON.stringify(persisted));
              }
              const errors=[],frames=[];
              page.on('pageerror',e=>errors.push('ERROR '+String(e)));
              page.on('console',msg=>{if(msg.type()==='error')errors.push('CONSOLE '+msg.text());else if(msg.text().startsWith('TRACE_'))frames.push(msg.text())});
              await page.route('**/app-enhancements.js*',route=>route.fulfill({status:200,contentType:'application/javascript',body:source}));
              await page.addInitScript(()=>{
                const Native=window.MutationObserver;let id=0;
                window.MutationObserver=class extends Native {
                  constructor(fn){
                    const key=++id,at=String(new Error().stack||'').slice(0,240);let calls=0;
                    super(function(mutations,observer){calls++;if(calls===15||calls===75||calls===250)console.log('TRACE_MUTATION',key,calls,at);
                      if(calls>250){console.error('TRACE_MUTATION_DISABLED',key,calls,at);observer.disconnect();return;}
                      return fn(mutations,observer);
                    });
                  }
                };
              });
              let started=Date.now();
              try{await page.goto('http://localhost:8765/index.html',{waitUntil:'domcontentloaded',timeout:12000})}catch(e){errors.push('NAV '+String(e))}
              await new Promise(resolve=>setTimeout(resolve,6000));
              const value=await Promise.race([page.evaluate(()=>({ready:document.documentElement.classList.contains('movie30-ready'),rank:document.querySelectorAll('#rankRoot .rank-card').length,text:document.querySelector('#summary')?.textContent})).catch(e=>String(e)),new Promise(resolve=>setTimeout(()=>resolve('BLOCKED'),3400))]);
              let tap;
              if(value!=='BLOCKED') {
                try{await page.locator('.tab[data-page="distribution"]').click({timeout:1800});tap=await page.locator('.tab.active').getAttribute('data-page')}catch(e){tap='FAIL '+String(e).slice(0,160)}
              } else tap='BLOCKED';
              console.log('VARIANT',name,'LEN',source.length,'TIME',Date.now()-started,'EVAL',JSON.stringify(value),'TAP',tap,'TRACES',JSON.stringify(frames.slice(-10)),'ERRORS',JSON.stringify(errors.slice(0,8)));
              await context.close().catch(()=>{});
            }
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE

      - name: Verify restored drag-style rank swapping
        shell: bash
        run: |
          set -e
          npm install --no-save --no-package-lock playwright-core@1.56.1 >/dev/null 2>&1
          python3 -m http.server 8766 >/tmp/movie-http-2.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright-core'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const doc=JSON.parse(fs.readFileSync('live-state.json','utf8'));
            await page.addInitScript(data=>localStorage.setItem('movie30_data_v1',data),JSON.stringify({...doc.state,updatedAt:Date.now()}));
            let errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://localhost:8766/index.html',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('html.movie30-ready',{timeout:20000});
            await page.locator('#searchRank').fill('パラサイト');
            await page.waitForTimeout(400);
            const searched=await page.evaluate(()=>{
              const root=document.querySelector('#rankRoot');
              const card=root.querySelector('.rank-card[data-id]'),h=card?.querySelector('.drag-handle');
              return {query:document.querySelector('#searchRank').value,count:root.querySelectorAll('.rank-card').length,
                title:card?.querySelector('.rank-title')?.textContent,handle:h?.textContent,
                hidden:h?.disabled,toolsZ:getComputedStyle(document.querySelector('#page-rank>.tools')).zIndex,
                navZ:getComputedStyle(document.querySelector('#starJumpBar')).zIndex};
            });
            console.log('SEARCHED',JSON.stringify(searched));
            if(searched.count<1||searched.count>15||searched.handle!=='↗'||searched.hidden)throw Error('Search result lacks active global jump arrow');
            const id=await page.locator('#rankRoot .rank-card[data-id]').first().getAttribute('data-id');
            await page.locator('#rankRoot .drag-handle.movie99-jump').first().click({force:true,timeout:8000});
            await page.waitForTimeout(1900);
            const jumped=await page.evaluate(id=>{
              const q=document.querySelector('#searchRank'),card=document.querySelector('#rankRoot .rank-card[data-id="'+id+'"]');
              const rect=card?.getBoundingClientRect(),nav=document.querySelector('#starJumpBar').getBoundingClientRect();
              return {query:q.value,count:document.querySelectorAll('#rankRoot .rank-card').length,
               focused:!!card?.classList.contains('v66-focus'),buttons:card?.querySelectorAll('.v66-pos [data-sw]').length,
               rect:rect&&{top:Math.round(rect.top),bottom:Math.round(rect.bottom)},
               nav:{top:Math.round(nav.top),bottom:Math.round(nav.bottom)},height:innerHeight,debug:window.__movie30LastJump99||null};
            },id);
            console.log('JUMPED',JSON.stringify(jumped),'PAGE_ERRORS',JSON.stringify(errors.slice(-10)));
            if(jumped.query!==''||jumped.count<300||!jumped.focused||jumped.buttons!==2)throw Error('Search arrow did not restore full ranking at target');
            if(jumped.rect.top<0||jumped.rect.top>=jumped.height)throw Error('Target is offscreen after global jump');
            const move=await page.evaluate(id=>{
              const c=document.querySelector('#rankRoot .rank-card[data-id="'+id+'"]');
              const list=c?.closest('.score-list'),cards=[...(list?.querySelectorAll('.rank-card[data-id]')||[])].map(x=>x.dataset.id);
              return {length:cards.length,idx:cards.indexOf(id),order:cards};
            },id);
            console.log('SWAP_BEFORE',JSON.stringify({length:move.length,idx:move.idx}));
            if(move.length>1){
              const d=move.idx<move.length-1?'1':'-1';
              await page.locator('#rankRoot .rank-card[data-id="'+id+'"] .v66-pos [data-sw="'+d+'"]').click({force:true});
              const active=await page.evaluate(()=>{
                const ghost=document.querySelector('.movie30-swap-ghost'),card=ghost&&document.querySelector('#rankRoot .rank-card[data-id="'+ghost.dataset.id+'"]');
                return {ghost:!!ghost,originalGhostClass:ghost?.classList.contains('drag-ghost'),
                  position:ghost&&getComputedStyle(ghost).position,
                  zIndex:ghost&&getComputedStyle(ghost).zIndex,
                  animations:document.getAnimations().length,
                  state:window.__movie30SwapMotion,rankSwapInFlight:!!ghost};
              });
              await page.waitForTimeout(230);
              const during=await page.evaluate(id=>{
                const ghost=document.querySelector('.movie30-swap-ghost'),
                  selected=document.querySelector('#rankRoot .rank-card[data-id="'+id+'"]'),
                  rect=ghost?.getBoundingClientRect();
                return {ghost:!!ghost,transform:ghost&&getComputedStyle(ghost).transform,
                  top:rect?.top,left:rect?.left,opacity:ghost&&getComputedStyle(ghost).opacity,
                  selectedVisibility:selected&&getComputedStyle(selected).visibility,
                  selectedPosition:selected?.getBoundingClientRect().top,
                  state:window.__movie30SwapMotion};
              },id);
              const screenshot=(await page.screenshot({type:'jpeg',quality:62})).toString('base64');
              console.log('VISUAL_FRAME_230 '+screenshot);
              await page.waitForTimeout(820);
              const after=await page.evaluate(id=>{
                const c=document.querySelector('#rankRoot .rank-card[data-id="'+id+'"]'),ls=c.closest('.score-list');
                const ids=[...ls.querySelectorAll('.rank-card[data-id]')].map(x=>x.dataset.id);
                return {idx:ids.indexOf(id),ghost:document.querySelectorAll('.movie30-swap-ghost').length,focused:c.classList.contains('v66-focus')};
              },id);
              console.log('SWAP_ANIMATION',JSON.stringify(active),'DURING',JSON.stringify(during),'SWAP_AFTER',JSON.stringify(after),'DIRECTION',d);
              if(after.idx!==move.idx+Number(d))throw Error('Same-score rank swap failed');
              if(!active.ghost||!active.originalGhostClass||active.position!=='fixed'||active.animations<1)throw Error('Original floating drag ghost is missing');
              if(during.selectedVisibility!=='hidden'||!during.ghost)throw Error('Card did not visibly lift out before ranking updates');
              if(Math.abs(during.top-active.state.start[1])<7)throw Error('Ghost did not lift and move');
              if(after.ghost!==0||!after.focused)throw Error('Floating drag item did not land and restore selected card');
            }
            console.log('RANK_TEST_PASS',JSON.stringify({searched,jumped,errors}));
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

