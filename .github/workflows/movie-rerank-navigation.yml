name: Movie title details and provisional rank search
on:
  push:
    paths:
      - 'patch-v120.js'
      - 'scripts/regression/rerank-navigation.cjs'
      - 'scripts/regression/harness.cjs'
      - '.github/workflows/movie-rerank-navigation.yml'
  pull_request:
    paths:
      - 'patch-v120.js'
      - 'scripts/regression/rerank-navigation.cjs'
      - 'scripts/regression/harness.cjs'
      - '.github/workflows/movie-rerank-navigation.yml'
permissions:
  contents: read
jobs:
  rerank-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check patch-v120.js && node --check sw.js
      - run: node scripts/regression/rerank-navigation.cjs
