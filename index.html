<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Films · 採点＆順位</title>
<style>html,body{margin:0;background:#07090c;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif}.boot{padding:24px;font-size:14px;color:#aeb7c4}.boot b{color:#fff}</style>
</head>
<body><div class="boot"><b>映画データを読み込み中…</b><br>ランキングと採点データはそのまま保持されます。</div>
<script>
(async()=>{
  const APP_BUILD='20260925y';
  try{
    const vr=await fetch('./app-version.json?t='+Date.now(),{cache:'no-store'});
    if(vr.ok){
      const latest=String((await vr.json())?.version||'').trim();
      if(latest&&latest!==APP_BUILD){
        const u=new URL(location.href);u.searchParams.set('appv',latest);location.replace(u.toString());return;
      }
    }
  }catch(_){}
  try{
    const r=await fetch('./index-v13.html?v=20260925y',{cache:'no-store'});
    if(!r.ok)throw new Error('base '+r.status);
    let html=await r.text();

    const oldState='let state={version:13,updatedAt:0,assignments:{},starOverrides:{},exactScores:{},customFilms:[],scoreMap:JSON.parse(JSON.stringify(DEFAULT_MAP)),rankOrder:{},titleOverrides:{},categoryOverrides:{}};';
    const newState='let state={version:22,updatedAt:0,assignments:{},starOverrides:{},exactScores:{},customFilms:[],scoreMap:JSON.parse(JSON.stringify(DEFAULT_MAP)),rankOrder:{},titleOverrides:{},categoryOverrides:{},mediaTypeOverrides:{},genreOverrides:{},originSeeded:false,originOverrides:{},formatOverrides:{},runtimeOverrides:{},structuredSeeded:false};';
    html=html.replace(oldState,newState);

    const oldNormalize='function normalizeState(s){return {version:13,updatedAt:Number(s?.updatedAt||0),assignments:s?.assignments||{},starOverrides:s?.starOverrides||{},exactScores:s?.exactScores||{},customFilms:s?.customFilms||[],scoreMap:{...deepCopy(DEFAULT_MAP),...(s?.scoreMap||{})},rankOrder:s?.rankOrder||{},titleOverrides:s?.titleOverrides||{},categoryOverrides:s?.categoryOverrides||{}}}';
    const newNormalize='function normalizeState(s){return {version:22,updatedAt:Number(s?.updatedAt||0),assignments:s?.assignments||{},starOverrides:s?.starOverrides||{},exactScores:s?.exactScores||{},customFilms:s?.customFilms||[],scoreMap:{...deepCopy(DEFAULT_MAP),...(s?.scoreMap||{})},rankOrder:s?.rankOrder||{},titleOverrides:s?.titleOverrides||{},categoryOverrides:s?.categoryOverrides||{},mediaTypeOverrides:s?.mediaTypeOverrides||{},genreOverrides:s?.genreOverrides||{},originSeeded:!!s?.originSeeded,originOverrides:s?.originOverrides||{},formatOverrides:s?.formatOverrides||{},runtimeOverrides:s?.runtimeOverrides||{},structuredSeeded:!!s?.structuredSeeded}}';
    html=html.replace(oldNormalize,newNormalize);

    const robustLb=`async function fetchLbRss(username){const url=\`https://letterboxd.com/\${encodeURIComponent(username)}/rss/\`,cacheKey="movie30_lb_rss_cache_"+username,targets=[url,"https://api.allorigins.win/raw?url="+encodeURIComponent(url),"https://corsproxy.io/?url="+encodeURIComponent(url),"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(url)];let errs=[];for(const target of targets){try{const r=await fetch(target,{cache:"no-store",headers:{Accept:"application/rss+xml,application/xml,text/xml,text/plain,*/*"}});if(!r.ok)throw new Error("HTTP "+r.status);const text=await r.text();if(!/<(?:rss|item)[\\s>]/i.test(text))throw new Error("RSS形式ではありません");try{localStorage.setItem(cacheKey,JSON.stringify({at:Date.now(),text}))}catch(_){}return text}catch(e){errs.push(e?.message||String(e))}}try{const c=JSON.parse(localStorage.getItem(cacheKey)||"null");if(c?.text)return c.text}catch(_){}throw new Error("RSSを取得できませんでした"+(errs.length?" ("+errs.join(" / ")+")":""))}`;
    html=html.replace(/async function fetchLbRss\(username\)\{[\s\S]*?\}function normKey/,robustLb+'function normKey');

    html=html.replace('</body>','<script src="./patch-v14.js?v=20260925y"><\/script><script src="./patch-v15.js?v=20260925y"><\/script><script src="./patch-v16.js?v=20260925y"><\/script><script src="./patch-v17.js?v=20260925y"><\/script><script src="./patch-v18.js?v=20260925y"><\/script><script src="./patch-v19.js?v=20260925y"><\/script><script src="./patch-v20.js?v=20260925y"><\/script><script src="./patch-v21.js?v=20260925y"><\/script><script src="./patch-v22.js?v=20260925y"><\/script><script src="./patch-v23.js?v=20260925y"><\/script><script src="./patch-v24.js?v=20260925y"><\/script><script src="./patch-v25.js?v=20260925y"><\/script><script src="./patch-v26.js?v=20260925y"><\/script><script src="./patch-v27.js?v=20260925y"><\/script><script src="./patch-v28.js?v=20260925y"><\/script><script src="./patch-v29.js?v=20260925y"><\/script><script src="./patch-v30.js?v=20260925y"><\/script><script src="./patch-v31.js?v=20260925y"><\/script><script src="./patch-v33.js?v=20260925y"><\/script><script src="./patch-v34.js?v=20260925y"><\/script><script src="./patch-v35.js?v=20260925y"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><b>読み込みに失敗しました。</b><br>'+String(e.message||e)+'</div>';
  }
})();
</script>
</body></html>
